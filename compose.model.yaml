# Optional: merge the ml/ implementation before building this service.
services:
  model:
    image: inspection-model:local
    build:
      context: ./ml
      dockerfile: Dockerfile
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --checkpoint
      - /models/model.pt
      - --contract
      - /models/final-freeze.json
    environment:
      TMPDIR: /uploads-tmp
    volumes:
      - model-uploads:/uploads-tmp
      - type: bind
        source: ${MODEL_WEIGHTS_PATH:?Set an absolute checkpoint path in .env}
        target: /models/model.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEL_CONTRACT_PATH:?Set an absolute frozen-contract path in .env}
        target: /models/final-freeze.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - ml.healthcheck
        - --port
        - "8001"
        - --contract
        - /models/final-freeze.json
      interval: 10s
      timeout: 7s
      start_period: 45s
      retries: 5
    restart: unless-stopped
  api:
    environment:
      MODEL_API_URL: http://model:8001
    depends_on:
      model: { condition: service_healthy }

volumes:
  model-uploads:
