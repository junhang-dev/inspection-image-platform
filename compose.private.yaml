name: inspection-private
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Dedicated private database required}
      MYSQL_USER: ${MYSQL_USER:?Dedicated private user required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Dedicated private password required}
      MYSQL_ROOT_PASSWORD: ${PRIVATE_MYSQL_ROOT_PASSWORD:?Dedicated private root required}
    ports: ["127.0.0.1:${MYSQL_PORT:?Dedicated private port required}:3306"]
    volumes: ["private-mysql:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${PRIVATE_MINIO_ROOT_USER:?Dedicated private root required}
      MINIO_ROOT_PASSWORD: ${PRIVATE_MINIO_ROOT_PASSWORD:?Dedicated private root required}
    ports: ["127.0.0.1:${MINIO_PORT:?Dedicated private port required}:9000"]
    volumes: ["private-minio:/data"]
    restart: unless-stopped
volumes:
  private-mysql:
  private-minio:
