  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const root = document.getElementById("plant-asset-study");
    const canvas = root.querySelector("#asset-canvas");
    const teamSelect = root.querySelector("#asset-team");
    const rackSelect = root.querySelector("#asset-rack");
    const offsiteRackSelect = root.querySelector("#asset-offsite-rack");
    const detail = root.querySelector("#asset-detail");
    const selectionRectangle = root.querySelector(".selection-rectangle");
    const sendToApp = (payload) =>
      window.parent.postMessage(
        { source: "plant-explorer", ...payload },
        window.location.origin,
      );
    const teamNames = ["정유1팀", "정유2팀", "정유3팀", "정유4팀"];
    const teamCenters = [
      [-28, -20],
      [28, -20],
      [-28, 20],
      [28, 20],
    ];
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#eef8f7");
    scene.fog = new THREE.Fog("#eef8f7", 205, 330);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 320);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    let disposed = false;
    canvas.addEventListener("webglcontextlost", (event) => {
      event.preventDefault();
      if (!disposed) sendToApp({ type: "error" });
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 7;
    controls.maxDistance = 190;
    const overviewPolarLimit = Math.PI * 0.47;
    controls.maxPolarAngle = overviewPolarLimit;
    const views = {
      plant: { target: [0, 2, 11], eye: [79, 88, 117] },
      team: { target: [0, 3, 0], eye: [25, 27, 33] },
      rack: { target: [0, 3, 0], eye: [8, 8, 11] },
    };
    camera.position.set(...views.plant.eye);
    controls.target.set(...views.plant.target);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xcbdad6, 1.7));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(-45, 90, 65);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -70;
    sun.shadow.camera.right = 70;
    sun.shadow.camera.top = 70;
    sun.shadow.camera.bottom = -70;
    sun.shadow.bias = -0.0005;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xc7f4ed, 0.45);
    fill.position.set(50, 20, -50);
    scene.add(fill);

    const mat = {
      earth: new THREE.MeshStandardMaterial({ color: 0xdcebe5, roughness: 1 }),
      zoneA: new THREE.MeshStandardMaterial({ color: 0xeaf0e9, roughness: 1 }),
      zoneB: new THREE.MeshStandardMaterial({ color: 0xe6eeec, roughness: 1 }),
      zoneC: new THREE.MeshStandardMaterial({ color: 0xecefe6, roughness: 1 }),
      zoneD: new THREE.MeshStandardMaterial({ color: 0xe8f0eb, roughness: 1 }),
      road: new THREE.MeshStandardMaterial({ color: 0x899b9a, roughness: 1 }),
      roadMark: new THREE.MeshStandardMaterial({
        color: 0xf8f9ee,
        roughness: 1,
      }),
      foundation: new THREE.MeshStandardMaterial({
        color: 0xc9d1ca,
        roughness: 1,
      }),
      concrete: new THREE.MeshStandardMaterial({
        color: 0xd6dcd5,
        roughness: 0.96,
      }),
      concreteFace: new THREE.MeshStandardMaterial({
        color: 0xbfcac5,
        roughness: 0.96,
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0x91a7a6,
        metalness: 0.48,
        roughness: 0.5,
      }),
      steelDark: new THREE.MeshStandardMaterial({
        color: 0x54706d,
        metalness: 0.5,
        roughness: 0.48,
      }),
      vessel: new THREE.MeshStandardMaterial({
        color: 0xe6efec,
        metalness: 0.4,
        roughness: 0.46,
      }),
      vesselShadow: new THREE.MeshStandardMaterial({
        color: 0xa4b9b4,
        metalness: 0.48,
        roughness: 0.48,
      }),
      pipeWhite: new THREE.MeshStandardMaterial({
        color: 0xf4f7f2,
        metalness: 0.35,
        roughness: 0.4,
      }),
      pipeTeal: new THREE.MeshStandardMaterial({
        color: 0x0d8f86,
        metalness: 0.38,
        roughness: 0.4,
      }),
      pipeSteel: new THREE.MeshStandardMaterial({
        color: 0x9caead,
        metalness: 0.53,
        roughness: 0.38,
      }),
      pipeSand: new THREE.MeshStandardMaterial({
        color: 0xc2a773,
        metalness: 0.38,
        roughness: 0.46,
      }),
      flange: new THREE.MeshStandardMaterial({
        color: 0x6a8985,
        metalness: 0.55,
        roughness: 0.36,
      }),
      corrosion: new THREE.MeshStandardMaterial({
        color: 0xbb6435,
        metalness: 0.12,
        roughness: 0.94,
      }),
      inspection: new THREE.MeshStandardMaterial({
        color: 0xf1ad4b,
        emissive: 0xa76b22,
        emissiveIntensity: 0.22,
        roughness: 0.55,
      }),
      drone: new THREE.MeshStandardMaterial({
        color: 0x183b3b,
        metalness: 0.34,
        roughness: 0.5,
      }),
    };
    const pipeMats = [
      mat.pipeWhite,
      mat.pipeTeal,
      mat.pipeSteel,
      mat.pipeWhite,
      mat.pipeSand,
      mat.pipeSteel,
    ];
    const unitBox = new THREE.BoxGeometry(1, 1, 1);
    const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 16);
    const spans = new Map();
    const offsiteSpans = new Map();
    const offsiteLabels = new Map();
    const zoneHits = [];
    const spanHits = [];
    const offsiteHits = [];
    const planHighlightGroup = new THREE.Group();
    const planMarkGeometry = new THREE.BoxGeometry(1, 1, 1);
    const planMarkMaterial = new THREE.MeshBasicMaterial({
      color: 0x087f78,
      transparent: true,
      opacity: 0.34,
      depthWrite: false,
    });
    scene.add(planHighlightGroup);
    let level = "plant";
    let selectedTeam = 1;
    let selectedRack = 7;
    let selectedOffsiteRack = 4;
    let planMode = false;
    let planTool = "select";
    let planRackIds = [];
    let cameraGoal = null;
    controls.addEventListener("start", () => {
      cameraGoal = null;
    });

    function syncOrbitRange(target = controls.target, eye = camera.position) {
      if (level !== "rack" && level !== "point") {
        controls.maxPolarAngle = overviewPolarLimit;
        return;
      }
      const radius = Math.max(eye.distanceTo(target), 0.01);
      const aboveGround = THREE.MathUtils.clamp(
        (0.7 - target.y) / radius,
        -1,
        1,
      );
      controls.maxPolarAngle = Math.min(Math.PI * 0.76, Math.acos(aboveGround));
    }

    function box(parent, material, x, y, z, w, h, d, shadow = true) {
      const mesh = new THREE.Mesh(unitBox, material);
      mesh.position.set(x, y, z);
      mesh.scale.set(w, h, d);
      mesh.castShadow = shadow;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    function cylinder(parent, material, x, y, z, radius, length, axis = "y") {
      const mesh = new THREE.Mesh(unitCylinder, material);
      mesh.position.set(x, y, z);
      mesh.scale.set(radius, length, radius);
      if (axis === "x") mesh.rotation.z = Math.PI / 2;
      if (axis === "z") mesh.rotation.x = Math.PI / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    function pipeRoute(points, radius, material) {
      const curve = new THREE.CatmullRomCurve3(
        points.map((p) => new THREE.Vector3(...p)),
        false,
        "centripetal",
      );
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 42, radius, 12, false),
        material,
      );
      mesh.castShadow = true;
      scene.add(mesh);
    }
    function label(text, x, y, z, scale = 1) {
      const c = document.createElement("canvas");
      c.width = 384;
      c.height = 88;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.roundRect(3, 3, 378, 82, 18);
      ctx.fill();
      ctx.strokeStyle = "#b4d4ce";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = "#176f69";
      ctx.font = "600 35px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 192, 46);
      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
        }),
      );
      sprite.position.set(x, y, z);
      sprite.scale.set(4.25 * scale, 1.02 * scale, 1);
      scene.add(sprite);
      return sprite;
    }
    function road(x, z, w, d) {
      box(scene, mat.road, x, 0.055, z, w, 0.11, d, false);
      const alongX = w > d;
      const len = alongX ? w : d;
      for (let p = -len / 2 + 3; p < len / 2 - 2; p += 5) {
        box(
          scene,
          mat.roadMark,
          alongX ? x + p : x,
          0.12,
          alongX ? z : z + p,
          alongX ? 1.6 : 0.1,
          0.025,
          alongX ? 0.1 : 1.6,
          false,
        );
      }
    }
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(128, 150), mat.earth);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, -0.13, 12);
    floor.receiveShadow = true;
    scene.add(floor);
    box(scene, mat.zoneB, 0, 0.04, 0, 111, 0.08, 77, false);
    road(0, 0, 120, 5.3);
    road(0, 10, 5.3, 108);
    road(0, -40, 116, 3.2);
    road(0, 40, 116, 3.2);
    road(0, 70, 116, 3.2);
    road(-56, 15, 3.2, 110);
    road(56, 15, 3.2, 110);

    function rackCorridor(teamIndex, start, cross, count, firstRack, axis) {
      const center = teamCenters[teamIndex];
      const x0 = center[0];
      const z0 = center[1];
      const bay = 2.75;
      const acrossX = axis === "z";
      const centerAlong = start + (count * bay) / 2;
      const midX = x0 + (acrossX ? cross : centerAlong);
      const midZ = z0 + (acrossX ? centerAlong : cross);
      for (let b = 0; b <= count; b += 1) {
        const along = start + b * bay;
        const bx = x0 + (acrossX ? cross : along);
        const bz = z0 + (acrossX ? along : cross);
        if (b % 3 === 0 || b === count) {
          for (const side of [-2.45, 2.45]) {
            const px = bx + (acrossX ? side : 0);
            const pz = bz + (acrossX ? 0 : side);
            box(scene, mat.foundation, px, 0.16, pz, 1.15, 0.32, 1.15);
            box(scene, mat.concrete, px, 2.58, pz, 0.62, 4.8, 0.62);
          }
          box(
            scene,
            mat.concreteFace,
            bx,
            2.48,
            bz,
            acrossX ? 5.55 : 0.48,
            0.42,
            acrossX ? 0.48 : 5.55,
          );
          box(
            scene,
            mat.concreteFace,
            bx,
            4.44,
            bz,
            acrossX ? 5.55 : 0.48,
            0.42,
            acrossX ? 0.48 : 5.55,
          );
        }
        if (b === count) continue;
        const alongMid = along + bay / 2;
        const hx = x0 + (acrossX ? cross : alongMid);
        const hz = z0 + (acrossX ? alongMid : cross);
        const rackId = firstRack + b;
        const hit = new THREE.Mesh(
          new THREE.BoxGeometry(

          : level === "team"
            ? teamNames[selectedTeam] +
              " 구역 · 듬성한 지지대 사이 랙 구간과 주변 설비를 살펴봅니다. <small>랙을 클릭하면 해당 구간으로 이동합니다.</small>"
            : level === "offsite"
              ? "오프사이트 이송 랙 O-01~O-08 · O-04의 높은 배관 지지부를 선택해 보세요. <small>근접 접근에는 비계 등이 필요할 수 있는 가상 상황입니다.</small>"
              : level === "point"
                ? selectedOffsiteRack === 4
                  ? "O-04 · 배관 지지부의 가상 CPC 예시. 드론은 랙 아래에서 접촉부를 사선으로 올려다봅니다. <small>확보한 사진의 확인 → AI 판독 → 이력 관리는 향후 서비스 연결 흐름입니다. 숨은 접촉면이나 두께는 사진만으로 확정하지 않습니다.</small>"
                  : "O-" +
                    String(selectedOffsiteRack).padStart(2, "0") +
                    " · 오프사이트 고소 배관 구간. <small>O-04에는 접촉부 부식 예시가 표시됩니다.</small>"
                : teamNames[selectedTeam] +
                  " · R-" +
                  String(selectedRack).padStart(2, "0") +
                  " 구간 <small>굵은 배관, 상·하부 데크, 콘크리트 지지대, 점검용 보행로를 자세히 봅니다.</small>";
    }
    function setView(nextLevel, team = selectedTeam, rack = selectedRack) {
      level = nextLevel;
      selectedTeam = team;
      selectedRack = rack;
      moveToView();
      updatePlanHighlight();
      sendToApp({
        type: "selection",
        level,
        teamIndex: selectedTeam,
        rackNumber: selectedRack,
        offsiteRackNumber: selectedOffsiteRack,
      });
    }
    function updatePlanHighlight() {
      planHighlightGroup.clear();
      if (!planMode) return;
      for (const rackNumber of planRackIds) {
        const hit = spans.get(selectedTeam + ":" + rackNumber);
        if (!hit) continue;
        const mark = new THREE.Mesh(planMarkGeometry, planMarkMaterial);
        mark.position.copy(hit.position);
        const size = hit.geometry.parameters;
        mark.scale.set(size.width, size.height, size.depth);
        planHighlightGroup.add(mark);
      }
    }
    function setPlanTool(tool) {
      planTool = tool === "navigate" ? "navigate" : "select";
      root.dataset.planTool = planTool;
      controls.mouseButtons.LEFT =
        planMode && planTool === "select" ? null : THREE.MOUSE.ROTATE;
      selectionRectangle.style.display = "none";
    }
    function setPlanMode(enabled, racks = [], tool = "select") {
      planMode = enabled;
      planRackIds = racks.filter(
        (rack) => Number.isInteger(rack) && rack >= 1 && rack <= 30,
      );
      root.classList.toggle("plan-mode", enabled);
      setPlanTool(tool);
      updatePlanHighlight();
    }
    window.addEventListener("message", (event) => {
      if (
        event.source !== window.parent ||
        event.origin !== window.location.origin ||
        event.data?.source !== "dashboard"
      )
        return;
      const data = event.data;
      if (data.type === "hello") {
        sendToApp({ type: "ready" });
        return;
      }
      if (data.type === "render-pause") {
        renderer.setAnimationLoop(data.paused ? null : renderFrame);
        return;
      }
      if (data.type === "view") {
        if (data.level === "plant") setView("plant");
        else if (data.level === "offsite") setView("offsite");
        else if (
          data.level === "point" &&
          Number.isInteger(data.offsiteRackNumber) &&
          data.offsiteRackNumber >= 1 &&
          data.offsiteRackNumber <= 8
        ) {
          selectedOffsiteRack = data.offsiteRackNumber;
          setView("point");
        } else if (
          data.level === "team" &&
          Number.isInteger(data.teamIndex) &&
          data.teamIndex >= 0 &&
          data.teamIndex < 4
        )
          setView("team", data.teamIndex);
        else if (
          data.level === "rack" &&
          Number.isInteger(data.teamIndex) &&
          Number.isInteger(data.rackNumber)
        )
          setView("rack", data.teamIndex, data.rackNumber);
      }
      if (data.type === "plan-mode")
        setPlanMode(
          Boolean(data.enabled),
          Array.isArray(data.racks) ? data.racks : [],
          data.tool,
        );
      if (data.type === "plan-tool" && planMode) setPlanTool(data.tool);
      if (data.type === "plan-racks") {
        planRackIds = Array.isArray(data.racks) ? data.racks : [];
        updatePlanHighlight();
      }
    });
    root.querySelectorAll("[data-level]").forEach((button) =>
      button.addEventListener("click", () => {
        if (button.dataset.level === "point") selectedOffsiteRack = 4;
        setView(button.dataset.level);
      }),
    );
    teamSelect.addEventListener("change", () =>
      setView("team", teamNames.indexOf(teamSelect.value)),
    );
    rackSelect.addEventListener("change", () =>
      setView("rack", selectedTeam, Number(rackSelect.value)),
    );
    offsiteRackSelect.addEventListener("change", () => {
      selectedOffsiteRack = Number(offsiteRackSelect.value);
      setView("point");
    });
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerStart = null;
    let dragged = false;
    canvas.addEventListener("pointerdown", (event) => {
      pointerStart =
        !planMode || (planTool === "select" && event.button === 0)
          ? [event.clientX, event.clientY]
          : null;
      dragged = false;
      if (planMode && pointerStart) canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!pointerStart) return;
      if (
        Math.hypot(
          event.clientX - pointerStart[0],
          event.clientY - pointerStart[1],
        ) > 6
      )
        dragged = true;
      if (planMode && planTool === "select") {
        const bounds = canvas.getBoundingClientRect();
        selectionRectangle.style.display = "block";
        selectionRectangle.style.left =
          Math.min(pointerStart[0], event.clientX) - bounds.left + "px";
        selectionRectangle.style.top =
          Math.min(pointerStart[1], event.clientY) - bounds.top + "px";
        selectionRectangle.style.width =
          Math.abs(event.clientX - pointerStart[0]) + "px";
        selectionRectangle.style.height =
          Math.abs(event.clientY - pointerStart[1]) + "px";
      }
    });
    canvas.addEventListener("pointerup", (event) => {
      if (
        planMode &&
        planTool === "select" &&
        pointerStart &&
        event.button === 0
      ) {
        const bounds = canvas.getBoundingClientRect();
        const left = Math.min(pointerStart[0], event.clientX);
        const right = Math.max(pointerStart[0], event.clientX);
        const top = Math.min(pointerStart[1], event.clientY);
        const bottom = Math.max(pointerStart[1], event.clientY);
        let next = null;
        if (right - left > 6 && bottom - top > 6) {
          const selected = [];
          for (let rackNumber = 1; rackNumber <= 30; rackNumber += 1) {
            const hit = spans.get(selectedTeam + ":" + rackNumber);
            const projected = hit.position.clone().project(camera);
            const x = bounds.left + ((projected.x + 1) * bounds.width) / 2;
            const y = bounds.top + ((1 - projected.y) * bounds.height) / 2;
            if (
              projected.z < 1 &&
              x >= left &&
              x <= right &&
              y >= top &&
              y <= bottom
            )
              selected.push(rackNumber);
          }
          if (selected.length)
            next = [...new Set([...planRackIds, ...selected])];
        } else {
          const pointer = new THREE.Vector2(
            ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
            -((event.clientY - bounds.top) / bounds.height) * 2 + 1,
          );
          raycaster.setFromCamera(pointer, camera);
          const hit = raycaster.intersectObjects(
            spanHits.filter((item) => item.userData.teamIndex === selectedTeam),
            false,
          )[0]?.object;
          if (hit) {
            const rackId = hit.userData.rackId;
            next = planRackIds.includes(rackId)
              ? planRackIds.filter((id) => id !== rackId)
              : [...planRackIds, rackId];
          }
        }
        if (next) {
          planRackIds = next.sort((a, b) => a - b);
          updatePlanHighlight();
          sendToApp({
            type: "plan-racks",
            teamIndex: selectedTeam,
            racks: planRackIds,
          });
        }
        selectionRectangle.style.display = "none";
      }
      pointerStart = null;
    });
    canvas.addEventListener("pointercancel", () => {
      pointerStart = null;
      dragged = false;
      selectionRectangle.style.display = "none";
    });
    canvas.addEventListener("click", (event) => {
      if (planMode) return;
      if (dragged) {
        dragged = false;
        return;
      }
      const bounds = canvas.getBoundingClientRect();
      pointer.set(
        ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
        -((event.clientY - bounds.top) / bounds.height) * 2 + 1,
      );
      raycaster.setFromCamera(pointer, camera);
      if (level === "plant") {
        if (raycaster.intersectObject(offsiteHit, false).length) {
          setView("offsite");
          return;
        }
        const zone = raycaster.intersectObjects(zoneHits, false)[0]?.object;
        if (zone) setView("team", zone.userData.teamIndex);
      } else if (level === "offsite" || level === "point") {
        const span = raycaster.intersectObjects(offsiteHits, false)[0]?.object;
        if (span) {
          selectedOffsiteRack = span.userData.offsiteRack;
          setView("point");
        }
      } else {
        const span = raycaster.intersectObjects(
          spanHits.filter((hit) => hit.userData.teamIndex === selectedTeam),
          false,
        )[0]?.object;
        if (span) setView("rack", selectedTeam, span.userData.rackId);
      }
    });
    function resize() {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
    }
    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(canvas);
    window.addEventListener("pagehide", (event) => {
      if (event.persisted || disposed) return;
      disposed = true;
      renderer.setAnimationLoop(null);
      resizeObserver.disconnect();
      controls.dispose();
      renderer.dispose();
      renderer.forceContextLoss();
    });
    resize();
    updateText();
    updateHighlight();
    sendToApp({
      type: "ready",
      level,
      teamIndex: selectedTeam,
      rackNumber: selectedRack,
    });
    function renderFrame() {
      if (cameraGoal) {
        camera.position.lerp(cameraGoal.eye, 0.12);
        controls.target.lerp(cameraGoal.target, 0.12);
        if (
          camera.position.distanceTo(cameraGoal.eye) < 0.06 &&
          controls.target.distanceTo(cameraGoal.target) < 0.06
        )
          cameraGoal = null;
      }
      syncOrbitRange();
      controls.update();
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(renderFrame);
  </script>
</div>
